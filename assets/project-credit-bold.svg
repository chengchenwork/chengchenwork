<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img"><title>Lending Club：125,000 条贷款样本，防止数据泄露，采用时间序列验证</title><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="320" rx="20" fill="#D4C4FA"/><text x="36" y="43" fill="#241440" font-size="18" font-weight="650" letter-spacing="1">CREDIT RISK  /  MODEL VALIDATION</text><text x="32" y="112" fill="#241440" font-size="58" font-weight="750" >预测未来，</text><text x="32" y="185" fill="#241440" font-size="58" font-weight="750" >先避免偷看答案。</text><text x="37" y="246" fill="#241440" font-size="25" font-weight="550" >Lending Club 信贷违约预测与特征工程</text><text x="37" y="287" fill="#241440" font-size="17" font-weight="600" >LIGHTGBM  ·  LEAKAGE CONTROL  ·  BOOTSTRAP</text><rect x="747" y="43" width="405" height="236" rx="15" fill="#3046F5"/><text x="777" y="135" fill="#FFFFFF" font-size="73" font-weight="800" letter-spacing="-2">125,000</text><text x="783" y="176" fill="#FFFFFF" font-size="24" font-weight="550" >条贷款样本</text><text x="783" y="236" fill="#C3F2DE" font-size="27" font-weight="700" letter-spacing="2">PAST  →  FUTURE</text></g></svg>